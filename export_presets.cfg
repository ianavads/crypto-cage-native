; Crypto Cage Combat — export presets scaffold.
;
; Two artifacts from one project (role chosen at runtime by main.gd):
;   • preset "Linux Server"  -> headless authority server, exported as a PCK
;       run on Hetzner:  godot-headless --headless --main-pack cage_server.pck
;   • preset "Windows Client" / "Linux Client" / "macOS Client" -> desktop client
;
; These are SCAFFOLDS. Open the project in the Godot editor once to let it fill
; the full per-platform option defaults and validate against installed export
; templates, then build with the commands in BUILD.md. The server preset sets
; dedicated_server=true so rendering resources are stripped from the PCK.

[preset.0]

name="Linux Server"
platform="Linux/X11"
runnable=true
advanced_options=true
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="client/*,tests/*"
export_path="build/linux_server/cage_server.pck"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

